<!DOCTYPE html>
<html>
<head>
    <title>新闻发布系统 V3</title>
    <meta charset="utf-8">
</head>
<body style="width: 600px; margin: 20px auto;">
    <h1>新闻发布</h1>
    <form action="#" method="post">
        标题：<input type="text" name="title" id="title" style="width: 400px;">
        <br/><br/>
        类别：<select name="newstype">
            <option value="1">校内</option>
            <option value="2">社会</option>
        </select>
        &nbsp;&nbsp;
        关键字：<input type="text" name="keyword" id="keyword">
        <br/><br/>
        内容：<textarea name="content" cols="60" rows="10"></textarea>
        <br/><br/>
        <input type="submit" value="发布">
    </form>
</body>
</html>
